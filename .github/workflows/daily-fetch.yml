name: Daily GProcurement Fetch

on:
  schedule:
    # Runs 3 times daily: 07:15 AM (00:15 UTC), 12:15 PM (05:15 UTC), 17:15 PM (10:15 UTC) Bangkok
    # 15 minutes past the hour avoids the midnight UTC queue delays on GitHub free runners
    - cron: '15 0,5,10 * * *'
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd scraper && npm ci

      - name: Run scraper
        env:
          D1_API_URL: ${{ secrets.D1_API_URL || 'https://gprocurement-veerubber.natt-charoen.workers.dev' }}
          D1_API_KEY: ${{ secrets.D1_API_KEY }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS || 'admin@veerubber.co.th' }}
        run: cd scraper && node src/index.js
