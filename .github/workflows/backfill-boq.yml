name: Backfill 100% In-Memory BOQ Scan

on:
  workflow_dispatch:

jobs:
  backfill-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd scraper && npm ci

      - name: Run 100% In-Memory BOQ Scanner on all D1 projects
        env:
          D1_API_URL: ${{ secrets.D1_API_URL || 'https://gprocurement-finder.natt-charoen.workers.dev' }}
          D1_API_KEY: ${{ secrets.D1_API_KEY }}
          API_KEY: ${{ secrets.D1_API_KEY }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        run: cd scraper && node src/backfill-boq-scan.js
