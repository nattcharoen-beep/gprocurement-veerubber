<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดประกาศ | Vee Rubber GProcurement Tracker</title>
  <meta name="description" content="รายละเอียดประกาศจัดซื้อจัดจ้างยาง - Vee Rubber GProcurement Tracker">
  <meta property="og:title" content="รายละเอียดประกาศ | Vee Rubber GProcurement Tracker">
  <meta property="og:description" content="ระบบติดตามโอกาสงานจัดซื้อจัดจ้างภาครัฐ สำหรับ วีรับเบอร์ (VEE RUBBER)">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://veerubber.co.th/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛞</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">วีรับเบอร์ | GProcurement Tracker</div>
    <div>
      <a href="dashboard.html" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.9rem;">← กลับหน้าหลัก</a>
    </div>
  </nav>

  <div class="container" style="max-width: 900px; margin: 30px auto;">
    <div class="card" id="detail-card">
      <div class="text-center">กำลังโหลด...</div>
    </div>
  </div>

  <script src="js/api.js?v=8.0"></script>
  <script src="js/auth.js?v=5.8"></script>
  <script src="js/common.js?v=5.8"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (!id) {
        window.location.href = 'dashboard.html';
        return;
      }

      try {
        const res = await api.getAnnouncementDetail(id);
        const item = res.data || res;
        const card = document.getElementById('detail-card');
        
        const typeKey = item.announce_type || '';
        const groupKey = item.product_group || '';
        const typeClass = `type-${typeKey.toLowerCase()}`;
        const groupClass = `group-${groupKey}`;
        const hasBoqVerified = !!(item.boq_summary || item.doc_verified);
        
        let html = `
          ${hasBoqVerified ? `
            <div style="margin-bottom: 20px;">
              <div style="background: linear-gradient(135deg, #15803d 0%, #16a34a 100%); color: #ffffff; font-weight: 900; font-size: 1.15rem; padding: 10px 20px; border-radius: 10px; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35); border: 2px solid #86efac; letter-spacing: 0.3px;">
                <span style="font-size: 1.4rem;">🎯</span> ตรวจเจอเนื้องานใน BOQ
                <span style="background: rgba(255, 255, 255, 0.25); color: #ffffff; font-size: 0.85rem; padding: 3px 10px; border-radius: 14px; font-weight: 700; margin-left: 6px;">สเปกตรงสาย 100%</span>
              </div>
            </div>
          ` : ''}
          <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <span class="badge ${typeClass}">${typeLabels[typeKey] || typeKey}</span>
            ${groupKey ? `<span class="badge ${groupClass}">${groupLabels[groupKey] || groupKey}</span>` : ''}
          </div>
          <h2 style="margin-bottom: 20px; color: var(--primary-color);">${item.project_name || 'ไม่มีชื่อโครงการ'}</h2>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px;">
            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
              <p style="margin-bottom: 10px; font-size: 1.05rem;"><strong>หน่วยงาน:</strong> <strong style="color: #003366; font-size: 1.1rem;">${item.department || '-'}</strong></p>
              <p style="margin-bottom: 10px; font-size: 1.05rem;"><strong>จังหวัด:</strong> ${
                item.province && item.province !== 'ไม่ระบุ' && item.province !== 'null'
                  ? `<span style="background: #e0f2fe; color: #0284c7; font-weight: 700; font-size: 0.95rem; padding: 2px 12px; border-radius: 6px; border: 1px solid #bae6fd; display: inline-flex; align-items: center; gap: 4px;">📍 ${item.province.startsWith('จังหวัด') || item.province === 'กรุงเทพมหานคร' || item.province.startsWith('จ.') ? item.province : 'จ.' + item.province}</span>`
                  : '-'
              }</p>
              <p style="margin-bottom: 8px;"><strong>งบประมาณ:</strong> <span class="announcement-budget">${formatMoney(item.budget)}</span></p>
              <p style="margin-bottom: 8px;"><strong>วันที่ประกาศ:</strong> ${formatDate(item.announce_date)}</p>
            </div>
            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
              <p style="margin-bottom: 8px;"><strong>เลขที่โครงการ:</strong> <strong style="font-family: monospace; font-size: 1.1rem; color: #003366;">${(item.project_id || item.id || '-').replace(/-[A-Za-z0-9]+$/, '')}</strong></p>
              <p style="margin-bottom: 8px;"><strong>เปิดค้นหาบน e-GP:</strong> <a href="https://process5.gprocurement.go.th/egp-agpc01-web/announcement?keywordSearch=${encodeURIComponent((item.project_id || item.id || '').replace(/-[A-Za-z0-9]+$/, ''))}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="padding: 4px 12px; font-size: 0.85rem; display: inline-block;" title="เปิดหน้าค้นหา e-GP ที่มีระบบความปลอดภัย Cloudflare">เปิดค้นหาใน e-GP 🔗</a></p>
            </div>
          </div>
        `;

        if (item.boq_summary || item.boq_matches || item.doc_verified) {
          let kw = '';
          if (item.boq_matches) {
            try {
              const mList = typeof item.boq_matches === 'string' ? JSON.parse(item.boq_matches) : item.boq_matches;
              if (Array.isArray(mList) && mList.length > 0 && mList[0].keyword) kw = mList[0].keyword;
            } catch (e) {}
          }
          if (!kw && item.boq_summary) {
            const m = item.boq_summary.match(/พบสเปก\s*["“]([^"”]+)["”]/i);
            if (m && m[1]) kw = m[1];
          }
          if (!kw) {
            if (item.product_group === 'passenger_car_tires') kw = 'ยางรถยนต์ & กระบะ';
            else if (item.product_group === 'truck_bus_tires') kw = 'ยางรถบรรทุก & บัส';
            else if (item.product_group === 'motorcycle_tires') kw = 'ยางจักรยานยนต์ & สายตรวจ';
            else if (item.product_group === 'otr_heavy_machinery') kw = 'ยาง OTR & เครื่องจักร';
            else if (item.product_group === 'bicycle_specialty_tires') kw = 'ยางจักรยาน & วีลแชร์';
            else if (item.product_group === 'tube_accessories') kw = 'ยางใน & อุปกรณ์';
            else kw = 'จัดซื้อยางราชการ';
          }

          html += `
            <div style="background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border: 2.5px solid #86efac; border-left: 8px solid #16a34a; border-radius: 10px; padding: 16px 20px; margin-bottom: 24px; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);">
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <span style="font-size: 1.8rem; line-height: 1;">🎯</span>
                <span style="font-size: 1.2rem; font-weight: 800; color: #15803d;">ตรวจพบ Keyword =</span>
                <span style="background: #16a34a; color: #ffffff; padding: 4px 16px; border-radius: 8px; font-size: 1.4rem; font-weight: 900; box-shadow: 0 2px 5px rgba(22, 163, 74, 0.3); letter-spacing: 0.3px;">${kw}</span>
              </div>
            </div>
          `;
        }

        if (item.doc_verified && typeKey === 'D0') {
          html += `
            <div style="background: #fffbeb; border: 1px solid #fed7aa; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                <h3 style="color: #9a3412; margin: 0;">📅 กำหนดการขั้นตอน e-Bidding (ข้อมูลตรงตามประกาศทางการ)</h3>
                <span style="background: #ecfdf5; color: #047857; font-weight: bold; font-size: 0.8rem; padding: 3px 10px; border-radius: 4px; border: 1px solid #a7f3d0;">✔ ตรวจสอบจากเอกสารประกาศจริง</span>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 0.95rem;">
                <div>
                  <strong>📥 ขอรับ/ดาวน์โหลดเอกสาร:</strong>
                  <div style="color: #7c2d12; margin-top: 4px;"><strong>${item.doc_start_date || '-'}</strong> ถึง <strong>${item.doc_end_date || '-'}</strong></div>
                </div>
                <div>
                  <strong>🔨 วันเสนอราคา/เคาะราคา (e-Bidding):</strong>
                  <div style="color: #b91c1c; font-weight: bold; margin-top: 4px; background: #fee2e2; padding: 4px 12px; border-radius: 4px; display: inline-block; border: 1px solid #fca5a5;">
                    📅 ${item.bid_date || '-'} (${item.bid_time || '09:00 – 12:00 น.'})
                  </div>
                </div>
              </div>
            </div>
          `;
        } else if (item.doc_verified && typeKey === 'B0') {
          html += `
            <div style="background: #fefce8; border: 1px solid #fef08a; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;">
                <h3 style="color: #854d0e; margin: 0;">📝 ช่วงรับฟังคำวิจารณ์ร่าง TOR (ข้อมูลตรงตามประกาศทางการ)</h3>
                <span style="background: #ecfdf5; color: #047857; font-weight: bold; font-size: 0.8rem; padding: 3px 10px; border-radius: 4px; border: 1px solid #a7f3d0;">✔ ตรวจสอบจากเอกสารร่าง TOR จริง</span>
              </div>
              <p style="color: #713f12; margin: 0; font-size: 0.95rem;"><strong>${item.doc_start_date || '-'}</strong> ถึง <strong>${item.doc_end_date || '-'}</strong></p>
            </div>
          `;
        } else if (item.doc_verified && typeKey === '15') {
          html += `
            <div style="background: #fff7ed; border: 1px solid #ffedd5; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;">
                <h3 style="color: #c2410c; margin: 0;">🟠 ประกาศราคากลาง e-Bidding (ข้อมูลตรงตามตาราง บก.01)</h3>
                <span style="background: #ecfdf5; color: #047857; font-weight: bold; font-size: 0.8rem; padding: 3px 10px; border-radius: 4px; border: 1px solid #a7f3d0;">✔ ตรวจสอบจากเอกสารราคากลางจริง</span>
              </div>
              <p style="color: #9a3412; margin: 0; font-size: 0.95rem;">ประกาศเมื่อ <strong>${item.doc_start_date || formatDate(item.announce_date)}</strong></p>
            </div>
          `;
        }

        if (typeKey === 'W0' && (item.winner_name || item.winner_price)) {
          const discountStr = item.discount_percent 
            ? item.discount_percent.toFixed(2) + '%'
            : (item.budget && item.winner_price 
                ? (((item.budget - item.winner_price) / item.budget) * 100).toFixed(2) + '%'
                : '-');

          html += `
            <div style="background: #eef6ff; padding: 20px; border-radius: 8px; margin-top: 20px; border-left: 4px solid var(--badge-w0, #0066cc);">
              <h3 style="margin-bottom: 12px; color: var(--primary-color);">📊 ข้อมูลผู้ชนะการเสนอราคา (คู่แข่ง)</h3>
              <p style="margin-bottom: 8px;"><strong>ชื่อบริษัทผู้ชนะ:</strong> <span style="font-size: 1.1rem; font-weight: bold; color: #003366;">${item.winner_name || 'ไม่ระบุ'}</span></p>
              <p style="margin-bottom: 8px;"><strong>ราคาที่ชนะ:</strong> <span style="color: var(--success, #28a745); font-weight: bold;">${formatMoney(item.winner_price)}</span></p>
              <p style="margin-bottom: 8px;"><strong>ส่วนลดจากราคากลาง:</strong> <span style="color: #dc3545; font-weight: bold;">${discountStr}</span></p>
              ${item.winner_tax_id ? `<p style="margin-bottom: 8px;"><strong>เลขประจำตัวผู้เสียภาษี:</strong> ${item.winner_tax_id}</p>` : ''}
            </div>
          `;
        }
        
        card.innerHTML = html;
        
      } catch (err) {
        document.getElementById('detail-card').innerHTML = `<div class="error-msg">ไม่พบข้อมูลประกาศ: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
